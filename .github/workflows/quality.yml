name: Build and browser quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
env:
  BASE_PATH: /HGS/
  SITE_URL: https://sl3ndrr.github.io
  RELEASE_READY: '0'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Production build and migration checks
        run: |
          npm run build
          npm run check
          npm test
      - name: Install optional browser test tooling
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Responsive browser quality and screenshots
        run: node scripts/browser-qa.mjs
      - name: Preserve browser report and screenshots
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: hgs-browser-quality
          path: docs/qa/browser/
          retention-days: 30
      - name: Upload Pages site after successful quality checks
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy concept to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public concept URL and resources
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = new URL(process.env.PREVIEW_URL);
          assert.equal(base.origin, 'https://sl3ndrr.github.io');
          assert.equal(base.pathname, '/HGS/');
          let html;
          for (let attempt = 0; attempt < 24; attempt++) {
            const response = await fetch(base, { cache: 'no-store' });
            html = await response.text();
            if (response.ok && html.includes('<meta name="site-base-path" content="/HGS/">')) break;
            if (attempt === 23) throw new Error(`Concept not available: HTTP ${response.status}`);
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          assert(html.includes('<meta name="robots" content="noindex,follow">'));
          assert(html.includes('rel="canonical" href="https://sl3ndrr.github.io/HGS/"'));
          for (const file of ['assets/site.css', 'assets/site.js', 'assets/search-index.json', 'kontakt/', 'suche/']) {
            const response = await fetch(new URL(file, base));
            assert.equal(response.status, 200, file);
          }
          const missing = await fetch(new URL('__missing_preview_check__/', base));
          assert.equal(missing.status, 404);
          console.log(`Public concept verified: ${base}, noindex, canonical, CSS, JS, search index, contact, search and real 404.`);
          JS
